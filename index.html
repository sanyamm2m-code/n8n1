<!DOCTYPE html>
<html>
<head>
    <title>GST Reconciliation Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:12px;
            width:400px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #message{
            margin-top:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>GST Reconciliation</h2>

    <form id="uploadForm">
        <label>Purchase Register</label>
        <input type="file" name="purchase" accept=".xlsx,.xls" required>

        <label>GSTR-2B</label>
        <input type="file" name="gstr2b" accept=".xlsx,.xls" required>

        <button type="submit">
            Start Reconciliation
        </button>
    </form>

    <div id="message"></div>
</div>

<script>

document.getElementById("uploadForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(this);

    document.getElementById("message").innerHTML =
    "Processing...";

    try{

        document.getElementById("uploadForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(this);

    document.getElementById("message").innerHTML =
    "Processing...";

    try {

        const response = await fetch(
            "https://disperser-proximity-exposure.ngrok-free.dev/webhook-test/gst-reconciliation",
            {
                method: "POST",
                body: formData
            }
        );

        if (!response.ok) {
            throw new Error("Upload failed");
        }

        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "GST_Reconciliation_Report.xlsx";

        document.body.appendChild(a);
        a.click();
        a.remove();

        window.URL.revokeObjectURL(url);

        document.getElementById("message").innerHTML =
        "✅ Report downloaded";

    }
    catch(err) {

        console.error(err);

        document.getElementById("message").innerHTML =
        "❌ Upload failed";

    }

});

        if(response.ok){
            document.getElementById("message").innerHTML =
            "✅ Files uploaded successfully";
        }
        else{
            document.getElementById("message").innerHTML =
            "❌ Upload failed";
        }

    }
    catch(err){
        document.getElementById("message").innerHTML =
        "❌ Error connecting to server";
    }

});

</script>

</body>
</html>
